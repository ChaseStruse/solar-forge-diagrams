<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Solar Forge Diagrams</title><meta name="description" content="Offline architecture diagramming: AWS, Kubernetes and flowchart diagrams on an isometric canvas, with network checks and animated traffic journeys."><meta name="theme-color" content="#07040f"><link rel="icon" type="image/svg+xml" href="/assets/solar-forge.svg">
<!-- Loading screen: styled inline so it paints before the app's script and stylesheet load. -->
<style>
html,body{margin:0;background:#07040f}
#splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#1a0f2e 0,#07040f 70%);color:#cbbfe6;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.28em;transition:opacity .35s ease}
#splash.splash-done{opacity:0;pointer-events:none}
#splash svg{width:88px;height:88px;filter:drop-shadow(0 0 22px #efb56a55);animation:splash-pulse 2.4s ease-in-out infinite}
#splash .splash-bar{width:180px;height:3px;border-radius:3px;background:#ffffff14;overflow:hidden}
#splash .splash-bar span{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#efb56a,#ff4fb8);animation:splash-slide 1.2s ease-in-out infinite}
#splash .splash-label{margin:0;font-weight:400;font-size:11px;letter-spacing:.12em;color:#8a7fa8}
@keyframes splash-pulse{50%{transform:scale(1.05);filter:drop-shadow(0 0 30px #efb56a88)}}
@keyframes splash-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash,#splash svg,#splash .splash-bar span{animation:none;transition:none}}
</style>
</head>
<body><div id="splash" role="status" aria-label="Loading Solar Forge Diagrams"><svg viewBox="0 0 256 256" aria-hidden="true"><rect x="8" y="8" width="240" height="240" rx="54" fill="#101925"/><path d="m128 37 23 67 67 24-67 23-23 68-24-68-67-23 67-24z" fill="#efb56a"/><path d="m128 83 12 33 33 12-33 12-12 33-12-33-33-12 33-12z" fill="#7d4f30"/><path d="m128 107 21 21-21 21-21-21z" fill="#ffe3b4"/></svg><div>SOLAR FORGE</div><div class="splash-bar"><span></span></div><p class="splash-label">Loading your workspace…</p></div><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
